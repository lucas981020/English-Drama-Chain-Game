<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>英語話劇台詞接龍 | Drama Chain</title>
  <style>
    :root {
      --bg:#0f1419;--card:#1a2332;--card2:#243044;--primary:#3b82f6;--primary-h:#2563eb;
      --success:#22c55e;--danger:#ef4444;--text:#e2e8f0;--muted:#94a3b8;--border:#334155;--hl:#fbbf24;--radius:12px;
      --hot:#f97316;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;-webkit-tap-highlight-color:transparent}
    .container{max-width:720px;margin:0 auto;padding:16px 16px 80px}
    h1{font-size:1.4rem;margin-bottom:4px}h2{font-size:1.2rem;margin-bottom:12px}h3{font-size:1rem;margin-bottom:8px}
    .muted{color:var(--muted);font-size:.85rem}
    .card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;border:1px solid var(--border)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border:none;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;width:100%;min-height:48px;transition:.15s;-webkit-user-select:none;user-select:none}
    .btn:active{transform:scale(.97)}.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-h)}
    .btn-sec{background:var(--card2);color:var(--text);border:1px solid var(--border)}
    .btn-outline{background:transparent;border:2px solid var(--border);color:var(--text)}
    .btn-outline.sel{border-color:var(--primary);background:rgba(59,130,246,.18);color:#93c5fd}
    .btn-outline.hot{border-color:var(--hot);color:#fdba74}
    .btn-outline.hot.sel{background:rgba(249,115,22,.2);border-color:var(--hot);color:#fed7aa}
    .btn-sm{padding:9px 14px;font-size:.85rem;min-height:38px;width:auto}
    .btn-group{display:flex;flex-direction:column;gap:10px}
    .btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    @media(min-width:480px){.btn-grid{grid-template-columns:1fr 1fr 1fr}}
    .role-btn{padding:11px 8px;font-size:.8rem;text-align:center;word-break:break-word}
    .opt{background:var(--card2);border:2px solid var(--border);border-radius:10px;padding:13px;cursor:pointer;font-size:.92rem;text-align:left;transition:.15s}
    .opt:hover{border-color:var(--primary)}.opt.ok{border-color:var(--success);background:rgba(34,197,94,.15)}.opt.ng{border-color:var(--danger);background:rgba(239,68,68,.15)}
    .prev{background:var(--card2);border-left:4px solid var(--primary);padding:14px;border-radius:0 10px 10px 0;margin-bottom:16px}
    .prev .spk{color:var(--primary);font-weight:700;font-size:.85rem;margin-bottom:2px}.prev .tx{font-size:1.02rem}
    .bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:12px;font-size:.85rem}
    .chip{background:var(--card2);padding:5px 11px;border-radius:20px}.chip b{color:var(--hl)}
    input[type=text],input[type=password],select{width:100%;padding:13px;border:2px solid var(--border);border-radius:10px;background:var(--card2);color:var(--text);font-size:1rem;outline:none}
    input:focus,select:focus{border-color:var(--primary)}
    select[multiple]{min-height:140px;padding:8px}
    select option{padding:8px;border-radius:4px}
    .chk-g{display:flex;flex-direction:column;gap:6px}
    .chk{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card2);border-radius:8px;cursor:pointer}
    .chk input{width:18px;height:18px;accent-color:var(--primary)}
    .rad-g{display:flex;flex-direction:column;gap:6px}
    .rad{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--card2);border-radius:8px;cursor:pointer;border:2px solid transparent}
    .rad.on{border-color:var(--primary);background:rgba(59,130,246,.12)}
    .rad input{width:16px;height:16px;accent-color:var(--primary)}
    .hidden{display:none!important}
    .box{padding:14px;border-radius:10px;margin:12px 0;text-align:center}
    .box.ok{background:rgba(34,197,94,.15);border:1px solid var(--success)}
    .box.ng{background:rgba(239,68,68,.15);border:1px solid var(--danger)}
    .sline{padding:9px 12px;border-bottom:1px solid var(--border);font-size:.92rem}
    .sline.hl{background:rgba(251,191,36,.14);border-left:3px solid var(--hl)}
    .sline .spk{color:var(--primary);font-weight:600}
    .act-h{background:var(--card2);padding:10px 14px;font-weight:700;margin-top:14px;border-radius:8px;position:sticky;top:0;z-index:5}
    .tabs{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .tab{padding:9px 12px;background:var(--card2);border:none;border-radius:8px;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap;font-size:.8rem}
    .tab.on{background:var(--primary);color:#fff}
    .mist{background:var(--card2);padding:12px;border-radius:8px;margin-bottom:8px;font-size:.88rem;display:flex;gap:10px;align-items:flex-start}
    .badge{min-width:24px;height:24px;border-radius:50%;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0}
    .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.72rem;font-weight:600;margin-right:4px}
    .tag-spk{background:rgba(59,130,246,.2);color:#93c5fd}
    .tag-line{background:rgba(249,115,22,.2);color:#fdba74}
    .lb-item{display:flex;align-items:center;gap:12px;padding:11px;background:var(--card2);border-radius:8px;margin-bottom:6px}
    .rank{width:26px;height:26px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem}
    .rank.g{background:#fbbf24;color:#000}.rank.s{background:#94a3b8;color:#000}.rank.b{background:#b45309;color:#fff}
    .nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 0;z-index:100}
    .nav button{background:none;border:none;color:var(--muted);font-size:.7rem;padding:5px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
    .nav button.on{color:var(--primary)}.nav button span{font-size:1.25rem}
    .prog{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:12px}.prog>div{height:100%;background:var(--primary);transition:width .3s}
    .ac{position:absolute;background:var(--card);border:1px solid var(--border);border-radius:8px;max-height:120px;overflow-y:auto;width:auto;min-width:120px;z-index:20;box-shadow:0 4px 16px rgba(0,0,0,.35)}
    .ac div{padding:8px 12px;cursor:pointer;font-size:.88rem}.ac div:hover{background:var(--card2)}
    .rel{position:relative}
    .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);padding:11px 18px;border-radius:10px;z-index:200;animation:fi .3s}
    @keyframes fi{from{opacity:0;transform:translateX(-50%) translateY(-8px)}}
    .empty{text-align:center;padding:36px 16px;color:var(--muted)}
    .gate{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
    .gate-box{background:var(--card);border-radius:14px;padding:24px;width:100%;max-width:360px;border:1px solid var(--border);text-align:center}
    .seg{display:flex;gap:6px;flex-wrap:wrap}.seg .btn-outline{width:auto;flex:1;min-width:70px;padding:10px 8px;font-size:.85rem}
    .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-left:6px}
    @keyframes sp{to{transform:rotate(360deg)}}
    .note{font-size:.78rem;color:var(--muted);margin-top:6px}
  </style>
</head>

  <script type="module">

/* Officer / English Officer 已合併為 English Officer */
const RAW = [
  {act:"Act I",scene:"Scene 1",spk:["Narrator"],tx:"It was 1431. After being defeated in battle, Joan of Arc was captured by the English. Accused of twelve criminal charges, she was sentenced to death by burning."},
  {act:"Act I",scene:"Scene 1",spk:["English Officer"],tx:"Burn the witch!"},

  {act:"Act I",scene:"Scene 1",spk:["English Officer"],tx:"Heretic, in men's clothes against nature, blaspheming God to deceive all—face justice in fire!"},
  {act:"Act I",scene:"Scene 1",spk:["Gilles"],tx:"Stop! I beg you, stop! She is no witch!"},

  {act:"Act I",scene:"Scene 1",spk:["Narrator"],tx:"Joan was fully engulfed in flames, fire mercilessly climbing toward her shoulders."},
  {act:"Act I",scene:"Scene 1",spk:["Joan"],tx:"No!"},
  {act:"Act I",scene:"Scene 1",spk:["Narrator"],tx:"Gilles left the square. Watching his comrade wilt in the flames one by one, his heart grew cold and dark. In his darkest moments, he began his descent into the world of black magic."},
  {act:"Act I",scene:"Scene 2",spk:["Gilles"],tx:"Joan... you saved me once. Now, I must find a way to bring you back. If only I could start over, I would protect you from all danger and suffering!"},
  {act:"Act I",scene:"Scene 2",spk:["Gilles"],tx:"My holy father... if thou wilt not answer, then allow the Dark Arts to guide me! I wish I could summon a person who can truly aid Joan. Grant me someone to save her! Amen!"},
  {act:"Act II",scene:"Scene 1",spk:["Narrator"],tx:"It is 2026. A group of high school students is visiting a local museum."},
  {act:"Act II",scene:"Scene 1",spk:["Teacher"],tx:"Students, please look at this. This is one of the most famous figures in French history: Joan of Arc. In the 15th century, she led the French army against the English and was regarded as a national hero. However, unfortunately, she was eventually captured and convicted of heresy at the age of nineteen."},
  {act:"Act II",scene:"Scene 1",spk:["Teacher"],tx:"In the end, she was burned at the stake!"},
  {act:"Act II",scene:"Scene 1",spk:["Student A"],tx:"That's so upsetting..."},
  {act:"Act II",scene:"Scene 1",spk:["Student B"],tx:"She was merely nineteen!"},
  {act:"Act II",scene:"Scene 1",spk:["Tim"],tx:"The stories of a hero always turn out to be tragic."},
  {act:"Act II",scene:"Scene 1",spk:["Teacher"],tx:"Hey! Tim, pay attention!"},
  {act:"Act II",scene:"Scene 1",spk:["Teacher"],tx:"Legend has it that Joan had a companion named Gilles. It's said that after her death, consumed by grief and regret, he turned to the dark arts. He even wrote a..."},
  {act:"Act II",scene:"Scene 1",spk:["Teacher"],tx:"...\"Cursed Grimoire\"!"},
  {act:"Act II",scene:"Scene 1",spk:["Student A","Student B"],tx:"Ahh!!"},
  {act:"Act II",scene:"Scene 1",spk:["Tim"],tx:"Oh, come on. It is now the 21st century. Grimoires? Really?"},
  {act:"Act II",scene:"Scene 1",spk:["Teacher"],tx:"And the book is said to still exist to this day."},
  {act:"Act II",scene:"Scene 1",spk:["Tim"],tx:"\"15th Century Anonymous Grimoire? Do Not Open\"? Wow. This looks like it's falling apart."},
  {act:"Act II",scene:"Scene 1",spk:["Tim"],tx:"Yew…It even bears a weird smell."},
  {act:"Act II",scene:"Scene 1",spk:["Tim"],tx:"Well... one quick peek shouldn't hurt, right?"},
  {act:"Act II",scene:"Scene 1",spk:["Tim"],tx:"Oh my goodness!"},
  {act:"Act III",scene:"Scene 1",spk:["Narrator"],tx:"It was 1431, the Battle of Jargeau, when there were merely two weeks remaining from the execution of Joan of Arc. In a fog-surrounded forest, the French army lies in wait, with their movements ghostly and silent."},
  {act:"Act III",scene:"Scene 1",spk:["Gilles"],tx:"It was legendary for you to be so brave in the battle last week. It's hard to believe that you were just a simple country girl a year ago."},
  {act:"Act III",scene:"Scene 1",spk:["Joan"],tx:"These victories are all the will of God. It is He who guides me through these battles."},
  {act:"Act III",scene:"Scene 1",spk:["Gilles"],tx:"It's a bit unusual for mist to be so thick at this hour, isn't it?"},
  {act:"Act III",scene:"Scene 1",spk:["Joan"],tx:"True. Let us hope this is a gift from God, which may ensure the success of our ambush."},
  {act:"Act III",scene:"Scene 1",spk:["Gilles"],tx:"The foes are here!"},
  {act:"Act III",scene:"Scene 1",spk:["Tim"],tx:"Where the hell am I?! Hey! Are you guys filming a movie? Wow, this prop looks so real!"},
  {act:"Act III",scene:"Scene 1",spk:["Gilles"],tx:"What a fool!"},
  {act:"Act III",scene:"Scene 1",spk:["Joan"],tx:"Wait! Stop! Don't be so hasty. His clothes doesn't look like English uniforms."},
  {act:"Act III",scene:"Scene 1",spk:["Tim"],tx:"Oh, wow! The ground is shaking! high-budget production, huh!"},
  {act:"Act III",scene:"Scene 1",spk:["Gilles"],tx:"Shh! They are coming. Get ready!"},
  {act:"Act III",scene:"Scene 1",spk:["Tim"],tx:"Ready for what? Have the cameras started rolling?"},
  {act:"Act III",scene:"Scene 1",spk:["Gilles"],tx:"Shut up. If you want to survive this, remain silent."},
  {act:"Act III",scene:"Scene 1",spk:["Joan"],tx:"I don't know who you are, but please—run while you still can."},
  {act:"Act III",scene:"Scene 1",spk:["Narrator"],tx:"While Joan and Gilles were distracted by the stranger, the English army arrived. However, a sudden, dramatic twist was about to occur."},
  {act:"Act III",scene:"Scene 1",spk:["Gilles"],tx:"What the hell is this sound?!"},
  {act:"Act III",scene:"Scene 1",spk:["Tim"],tx:"Oh no..."},
  {act:"Act III",scene:"Scene 1",spk:["English Soldier B"],tx:"Someone's there!"},
  {act:"Act III",scene:"Scene 1",spk:["Joan"],tx:"It's too late. We must fight!"},
  {act:"Act III",scene:"Scene 1",spk:["Joan"],tx:"All troops, ambush! Charge!"},

  {act:"Act III",scene:"Scene 1",spk:["Narrator"],tx:"Unfortunately, more English reinforcements emerge from the shadows. The French are being surrounded."},
  {act:"Act III",scene:"Scene 1",spk:["English Officer"],tx:"Seize the witch! For our glorious Father!"},
  {act:"Act III",scene:"Scene 1",spk:["Tim"],tx:"No way... You guys are actually at war?!"},

  {act:"Act IV",scene:"Scene 1",spk:["Narrator"],tx:"In the English camp, the atmosphere is heavy. The wounded are silent in their fear. The Officer looks on with chilling indifference."},
  {act:"Act IV",scene:"Scene 1",spk:["English Officer"],tx:"I know everything. I know which of you was the first to tuck tail and run."},

  {act:"Act IV",scene:"Scene 1",spk:["Lackey"],tx:"Me? Mercy, sir! What did I do wrong?"},
  {act:"Act IV",scene:"Scene 1",spk:["English Officer"],tx:"What does \"using our sacred Empire's flag for a barbecue\" mean then? You were the one who started the panic!"},
  {act:"Act IV",scene:"Scene 1",spk:["Lackey"],tx:"It was... it wasn't on purpose! Hehe..."},
  {act:"Act IV",scene:"Scene 1",spk:["English Officer"],tx:"Now that you're defeated, are you satisfied with this?"},
  {act:"Act IV",scene:"Scene 1",spk:["Soldiers"],tx:"...No, sir."},
  {act:"Act IV",scene:"Scene 1",spk:["English Officer"],tx:"Stop mumbling, Louder!"},
  {act:"Act IV",scene:"Scene 1",spk:["Soldiers"],tx:"NO, SIR!"},
  {act:"Act IV",scene:"Scene 1",spk:["English Officer"],tx:"Then shouldn't we take our revenge?"},
  {act:"Act IV",scene:"Scene 1",spk:["English Soldier A"],tx:"Com... Commander, the French had a new brat with them. He came out of nowhere and burned our sacred flag!"},
  {act:"Act IV",scene:"Scene 1",spk:["English Soldier B"],tx:"It's an ill omen, sir!"},
  {act:"Act IV",scene:"Scene 1",spk:["Lackey"],tx:"Honestly, I kind of want to learn how he did that."},
  {act:"Act IV",scene:"Scene 1",spk:["English Officer"],tx:"Shut up! Joan and that pack of peasants are nothing but slaves to Satan! Why should we fear them? Remember how they humiliated us today? Today, they burned our flag. Tomorrow... we burn their Saint!"},
  {act:"Act V",scene:"Scene 1",spk:["Narrator"],tx:"Against the odds, the French have secured a temporary victory. Grateful and curious about the \"miracle-working\" Tim, Joan, and her commanders invite him to join their victory feast. The camp is alive with energy as soldiers sing and enjoy a hard-earned meal."},
  {act:"Act V",scene:"Scene 1",spk:["French Soldier"],tx:"Hey, brother! It seems that you're quite talented, huh!"},

  {act:"Act V",scene:"Scene 1",spk:["Joan"],tx:"I cannot find the words to express my gratitude. Your help in repelling the English was invaluable."},

  {act:"Act V",scene:"Scene 1",spk:["Tim"],tx:"Come on, don't be so serious. Aren't we just rehearsing for the play?"},
  {act:"Act V",scene:"Scene 1",spk:["Joan","Gilles"],tx:"Huh?"},
  {act:"Act V",scene:"Scene 1",spk:["Tim"],tx:"...Huh?"},
  {act:"Act V",scene:"Scene 1",spk:["Tim"],tx:"Wait! Are you serious? I actually traveled back in time?! So... that battle just now... that was real?"},
  {act:"Act V",scene:"Scene 1",spk:["Gilles"],tx:"This is no place for your jokes—"},
  {act:"Act V",scene:"Scene 1",spk:["Joan"],tx:"Forgive me, I have not properly introduced myself. I am Joan of Arc. I carry the will of God to aid the Dauphin and save France，what about you?"},
  {act:"Act V",scene:"Scene 1",spk:["Tim"],tx:"I'm Tim. I'm from the 21th century and accidentally travel back here."},
  {act:"Act V",scene:"Scene 1",spk:["Gilles"],tx:"And I am Gilles de Rais. If you ever dare to lift a finger against Joan, I will make you regret it."},
  {act:"Act V",scene:"Scene 1",spk:["Tim"],tx:"Ha... ha... very funny."},
  {act:"Act V",scene:"Scene 1",spk:["Tim"],tx:"So, can I ask... how did this all start?"},
  {act:"Act V",scene:"Scene 1",spk:["Joan"],tx:"I was once a simple girl from the countryside. But one day, I heard the voices of the Saints."},
  {act:"Act V",scene:"Scene 1",spk:["Tim"],tx:"The voices?"},
  {act:"Act V",scene:"Scene 1",spk:["Joan"],tx:"They commanded me to help the Prince defeat the English and reclaim our land."},
  {act:"Act V",scene:"Scene 1",spk:["Tim"],tx:"And then what happened?"},
  {act:"Act V",scene:"Scene 1",spk:["Gilles"],tx:"Joan saved my life once. It is my greatest honor to follow her onto the field of battle. Under her command, we have won several victories. Her courage is known across the world—she is our hero, our Saint!"},
  {act:"Act V",scene:"Scene 1",spk:["Tim"],tx:"She definitely is!"},
  {act:"Act V",scene:"Scene 1",spk:["Gilles"],tx:"Yet those filthy English dogs... they dare to call her a witch!"},
  {act:"Act V",scene:"Scene 1",spk:["Joan"],tx:"Enough. Let's talk about something other than this."},
  {act:"Act V",scene:"Scene 1",spk:["Tim"],tx:"Check this out! Let me show you a dance from the future!"},
  {act:"Act V",scene:"Scene 1",spk:["Soldier"],tx:"It's... It's bad! They're here!"},
  {act:"Act V",scene:"Scene 1",spk:["Joan"],tx:"Be prepared for battle!"},
  {act:"Act V",scene:"Scene 1",spk:["Tim"],tx:"What? The English again? Shouldn't they be too scared to come out?"},

  {act:"Act V",scene:"Scene 1",spk:["English Officer"],tx:"Joan, I didn't expect you to be so... relaxed."},
  {act:"Act V",scene:"Scene 1",spk:["Tim"],tx:"Oh, look! It's Mr. Grumpy-Pants!"},
  {act:"Act V",scene:"Scene 1",spk:["English Officer"],tx:"Perfect. Our new friend is here too. Taking both of you at once sounds like a plan."},

  {act:"Act V",scene:"Scene 1",spk:["Joan"],tx:"What's wrong ? Aaaaaaaaaa~"},

function norm(s){return (s||'').toLowerCase().replace(/[^\w\s]/g,'').replace(/\s+/g,' ').trim();}
function lev(a,b){const m=a.length,n=b.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i++)dp[i][0]=i;for(let j=0;j<=n;j++)dp[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);return dp[m][n];}
function close(a,b){a=norm(a);b=norm(b);if(a===b)return 1;if(a.length<3)return 0;return lev(a,b)<=Math.max(2,Math.floor(Math.max(a.length,b.length)*.15));}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2000);}
function fmtTime(ms){const s=Math.round(ms/1000);const m=Math.floor(s/60);const r=s%60;return m>0?`${m}:${String(r).padStart(2,'0')}`:`${r}s`;}

function buildQ(){
  const lines=RAW.filter(l=>st.acts.includes(l.act));
  const pairs=[];
  for(let i=0;i<lines.length-1;i++){
    const p=lines[i],n=lines[i+1];
    if(n.i!==p.i+1)continue;
    if(st.roleMode==='mine'&&!n.spk.some(s=>st.myRoles.includes(s)))continue;
    pairs.push({p,n});
  }
  let q=shuffle(pairs);
  if(st.qCount!=='all')q=q.slice(0,+st.qCount);
  return q;
}
function mcOpts(c){
  const o=RAW.map(l=>l.tx).filter(t=>t!==c);
  const s=o.map(t=>({t,s:Math.abs(t.length-c.length)+Math.random()*20})).sort((a,b)=>a.s-b.s);
  return shuffle([c,...s.slice(0,3).map(x=>x.t)]);
}
function wordSuggestions(input, correctText){
  const dict=[...new Set((correctText.match(/[A-Za-z']+/g)||[]))];
  if(!dict.length)return [];
  const m=input.match(/([A-Za-z']+)$/);
  if(!m)return [];
  const cur=m[1]; if(cur.length<2)return [];
  const cl=cur.toLowerCase(); const hits=[];
  for(const w of dict){
    const wl=w.toLowerCase(); if(wl===cl)continue;
    if(wl.startsWith(cl)||cl.startsWith(wl.slice(0,3))){hits.push({w,score:0});continue;}
    const d=lev(cl,wl); if(d<=Math.max(1,Math.floor(wl.length*0.35))&&d>0)hits.push({w,score:d});
  }
  hits.sort((a,b)=>a.score-b.score);
  const uniq=[]; for(const h of hits){if(!uniq.includes(h.w))uniq.push(h.w);if(uniq.length>=4)break;}
  return uniq;
}
function applyWordSuggestion(input, suggestion){return input.replace(/[A-Za-z']+$/, suggestion);}

async function loadMistakes(){
  if(!st.nick)return;
  try{
    const snap=await getDoc(doc(db,'mistakes',st.nick));
    if(snap.exists()){
      const d=snap.data();
      // migrate old format if needed
      if(d.items) st.mistakes=d.items;
      else if(d.spk||d.line){
        const items=[];
        (d.spk||[]).forEach(m=>items.push({id:m.id,ps:m.ps,pt:m.pt,c:m.c,spkWrong:true,lineWrong:false,okSpk:m.ok,okLine:null}));
        (d.line||[]).forEach(m=>{
          const ex=items.find(x=>x.id.split('|')[0]===String(m.id).split('|')[0]);
          if(ex){ex.lineWrong=true;ex.okLine=m.ok;ex.c=Math.max(ex.c,m.c);}
          else items.push({id:m.id,ps:m.ps,pt:m.pt,c:m.c,spkWrong:false,lineWrong:true,okSpk:null,okLine:m.ok});
        });
        st.mistakes=items.sort((a,b)=>b.c-a.c);
      } else st.mistakes=[];
    }
  }catch(e){console.warn(e);}
}

function recMistQuestion(prev, next, spkWrong, lineWrong){
  if(!spkWrong&&!lineWrong)return;
  const id=String(prev.i);
  const ex=st.mistakes.find(m=>m.id===id);
  if(ex){
    ex.c++;
    if(spkWrong){ex.spkWrong=true;ex.okSpk=next.spk;}
    if(lineWrong){ex.lineWrong=true;ex.okLine=next.tx;}
  }else{
    st.mistakes.push({
      id, ps:prev.spk, pt:prev.tx, c:1,
      spkWrong:!!spkWrong, lineWrong:!!lineWrong,
      okSpk:spkWrong?next.spk:null, okLine:lineWrong?next.tx:null
    });
  }
  st.mistakes.sort((a,b)=>b.c-a.c);
  saveMistakes();
}

async function saveScore(){
  if(!st.nick||!st.unlocked||!canRank())return;
  const mode=lbModeKey();
  const answeredUnits=st.total+st.queue.length;
  const correctUnits=st.ss+st.ls;
  const accuracy=answeredUnits>0?correctUnits/answeredUnits:0;
  const entry={
    name:st.nick, spk:st.ss, line:st.ls,
    correct:correctUnits, total:answeredUnits,
    accuracy:Math.round(accuracy*10000)/10000,
    timeMs:st.timeMs, qCount:st.qCount, ansMode:st.ansMode,
    date:new Date().toISOString()
  };
  const ref=doc(db,'leaderboard',mode,'scores',st.nick);
  try{
    const old=await getDoc(ref);
    if(old.exists()){
      const o=old.data();
      if((o.accuracy||0)>entry.accuracy)return;
      if((o.accuracy||0)===entry.accuracy&&(o.timeMs||1e15)<=entry.timeMs)return;
    }
    await setDoc(ref,entry);
  }catch(e){console.warn(e);toast('排行榜上傳失敗');}
}

    if(st.ansMode==='mc')lineH=`<div class="card"><h3>💬 下一句？</h3><div style="display:flex;flex-direction:column;gap:8px">${st.opts.map((t,i)=>`<div class="opt" data-i="${i}">${t}</div>`).join('')}</div></div>`;
    else lineH=`<div class="card"><h3>💬 下一句？</h3>
      <div class="rel"><input type="text" id="lin" placeholder="逐字輸入…" autocomplete="off" value="${st.input.replace(/"/g,'&quot;')}">
      <div class="ac hidden" id="ac"></div></div>
      <p class="note">僅提示可能拼錯的單字</p>
      <button class="btn btn-primary" id="subL" style="margin-top:10px">✓</button></div>`;
  }else if(st.lineDone){
    lineH=`<div class="box ${st.lineOk?'ok':'ng'}">${st.lineOk?'✅':'❌'} <em>${n.tx}</em></div><button class="btn btn-primary" id="next">→</button>`;
  }
  appEl.innerHTML=`<div class="bar"><div class="chip">${st.idx+1}/${st.queue.length}</div><div class="chip">👤 <b>${st.ss}</b></div><div class="chip">💬 <b>${st.ls}</b></div></div>
    <div class="prog"><div style="width:${pct}%"></div></div>
    <div class="prev">
      <div class="spk">${p.spk.join(' & ')}${actEnds?' <span style="color:var(--hl);font-weight:700">· Act ends</span>':''}</div>
      <div class="tx">${p.tx}</div>
    </div>${spkH}${lineH}`;

  if(st.roleMode==='all'&&!st.spkDone){
    document.querySelectorAll('.role-btn').forEach(b=>b.onclick=()=>{const r=b.dataset.r;st.selSpk=st.selSpk.includes(r)?st.selSpk.filter(x=>x!==r):[...st.selSpk,r];render();});
    document.getElementById('subSpk').onclick=()=>{
      const ok=n.spk.length===st.selSpk.length&&n.spk.every(s=>st.selSpk.includes(s));
      st.spkOk=ok;st.spkDone=1;st.qSpkWrong=!ok;
      if(ok)st.ss++; st.total++; render();
    };
  }
  if(st.spkDone&&!st.lineDone&&st.ansMode==='mc'){
    document.querySelectorAll('.opt').forEach(c=>c.onclick=()=>{
      const chosen=st.opts[+c.dataset.i];st.lineOk=chosen===n.tx;st.lineDone=1;
      if(st.lineOk)st.ls++;
      recMistQuestion(p,n,st.qSpkWrong,!st.lineOk);
      document.querySelectorAll('.opt').forEach((x,i)=>{if(st.opts[i]===n.tx)x.classList.add('ok');else if(i===+c.dataset.i)x.classList.add('ng');});
      setTimeout(()=>render(),500);
    });
  }
  if(st.spkDone&&!st.lineDone&&st.ansMode==='input'){
    const inp=document.getElementById('lin'),ac=document.getElementById('ac');inp.focus();
    inp.oninput=()=>{
      st.input=inp.value;
      const sug=wordSuggestions(inp.value,st.correctLineTarget);
      if(sug.length){
        ac.innerHTML=sug.map(w=>`<div data-w="${w}">${w}</div>`).join('');
        ac.classList.remove('hidden');
        ac.querySelectorAll('div').forEach(d=>d.onclick=()=>{inp.value=applyWordSuggestion(inp.value,d.dataset.w);st.input=inp.value;ac.classList.add('hidden');inp.focus();});
      }else ac.classList.add('hidden');
    };
    document.getElementById('subL').onclick=()=>{
      const v=inp.value.trim();if(!v){toast('請輸入');return;}
      if(close(v,n.tx)){st.lineOk=1;st.lineDone=1;st.ls++;}
      else{st.lineOk=0;st.lineDone=1;}
      recMistQuestion(p,n,st.qSpkWrong,!st.lineOk);
      render();
    };
    inp.onkeydown=e=>{if(e.key==='Enter')document.getElementById('subL').click();};
  }
  if(st.lineDone)document.getElementById('next').onclick=()=>{
    st.idx++;
    if(st.idx>=st.queue.length){
      st.timeMs=Date.now()-st.t0;
      const finish=()=>{saveScore().finally(()=>go('result'));};
      if(canRank()){if(st.unlocked)finish();else askPwd(finish);}
      else go('result');
    }else startQ();
  };
}

function rResult(){
  const units=st.total+st.queue.length;
  const correct=st.ss+st.ls;
  const acc=units?Math.round(correct/units*100):0;
  const ranked=canRank();
  appEl.innerHTML=`<h2>完成</h2>
    <div class="card" style="text-align:center">
      <div style="display:flex;justify-content:center;gap:24px;margin:12px 0;flex-wrap:wrap">
        <div><div style="font-size:1.8rem;font-weight:700;color:var(--hl)">${acc}%</div><div class="muted">${correct}/${units}</div></div>
        <div><div style="font-size:1.8rem;font-weight:700;color:var(--hl)">${fmtTime(st.timeMs)}</div><div class="muted">⏱</div></div>
      </div>
      <p class="muted">${st.queue.length} 題 · ${st.roleMode==='mine'?'我的角色':'全角色'} · ${st.ansMode==='mc'?'四選一':'整句'}</p>
      <p class="note">${ranked?(st.unlocked?'已嘗試上傳排行榜':'需密碼才上傳'):'此組合不計入排行榜'}</p>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" id="a1">再練</button>
      <button class="btn btn-sec" id="a2">🏠</button>
      <button class="btn btn-sec" id="a3">📕</button>
    </div>`;
  document.getElementById('a1').onclick=()=>go('practice');
  document.getElementById('a2').onclick=()=>go('home');
  document.getElementById('a3').onclick=()=>go('mistakes');
}

function rMist(){
  appEl.innerHTML=`<h2>📕 錯題 <span class="muted">${st.mistakes.length}</span></h2><div id="ml"></div>`;
  const ml=document.getElementById('ml');
  if(!st.mistakes.length){ml.innerHTML='<div class="empty">🎉</div>';return;}
  ml.innerHTML=st.mistakes.map(m=>`
    <div class="mist">
      <div class="badge">${m.c}</div>
      <div style="flex:1">
        <div style="margin-bottom:4px">
          ${m.spkWrong?'<span class="tag tag-spk">👤 人物</span>':''}
          ${m.lineWrong?'<span class="tag tag-line">💬 台詞</span>':''}
        </div>
        <div class="muted" style="font-size:.78rem;margin-bottom:3px">${m.ps.join(' & ')} — ${m.pt.slice(0,55)}${m.pt.length>55?'…':''}</div>
        ${m.spkWrong&&m.okSpk?`<div><b>👤</b> ${Array.isArray(m.okSpk)?m.okSpk.join(' & '):m.okSpk}</div>`:''}
        ${m.lineWrong&&m.okLine?`<div><b>💬</b> ${m.okLine}</div>`:''}
      </div>
    </div>`).join('');
}

function rLB(){
  const modes=[
    {k:'all_50_mc',l:'50·四選一'},
    {k:'all_50_input',l:'50·整句'},
    {k:'all_all_mc',l:'全部·四選一'},
    {k:'all_all_input',l:'全部·整句'},
  ];
  appEl.innerHTML=`<h2>🏆 排行<span class="spin" id="lbSpin"></span></h2>
    <p class="note" style="margin-bottom:10px">全角色 · 正確率 → 時間</p>
    <div class="tabs" id="lt">${modes.map((m,i)=>`<button class="tab ${i===0?'on':''}" data-k="${m.k}">${m.l}</button>`).join('')}</div>
    <div id="ll"><div class="empty">載入中…</div></div>`;
  let cur='all_50_mc';
  function listen(mode){
    if(st.lbUnsub)st.lbUnsub();
    const qy=query(collection(db,'leaderboard',mode,'scores'),limit(80));
    st.lbUnsub=onSnapshot(qy,snap=>{
      document.getElementById('lbSpin')?.remove();
      let list=[];snap.forEach(d=>list.push(d.data()));
      list.sort((a,b)=>{
        const aa=a.accuracy||0,bb=b.accuracy||0;
        if(bb!==aa)return bb-aa;
        return (a.timeMs||1e15)-(b.timeMs||1e15);
      });
      list=list.slice(0,50);
      const ll=document.getElementById('ll');
      if(!list.length){ll.innerHTML='<div class="empty">—</div>';return;}
      ll.innerHTML=list.map((e,i)=>{
        const acc=Math.round((e.accuracy||0)*100);
        return `<div class="lb-item">
          <div class="rank ${i===0?'g':i===1?'s':i===2?'b':''}">${i+1}</div>
          <div style="flex:1"><b>${e.name}</b>
            <div class="muted" style="font-size:.75rem">${acc}% · ${e.correct||0}/${e.total||0} · ⏱ ${fmtTime(e.timeMs||0)}</div>
          </div>
          <b style="color:var(--hl)">${acc}%</b>
        </div>`;
      }).join('');
    },err=>{toast('排行榜載入失敗');console.warn(err);});
  }
  listen(cur);
  document.querySelectorAll('#lt .tab').forEach(t=>t.onclick=()=>{
    document.querySelectorAll('#lt .tab').forEach(x=>x.classList.toggle('on',x===t));
    cur=t.dataset.k;listen(cur);
  });
}

function rScript(){
  const opts=ALL_SPK.map(r=>`<option value="${r}" ${st.hl.includes(r)?'selected':''}>${r}</option>`).join('');
  let h=`<h2>📖 劇本</h2>
    <div class="card">
      <label class="muted" style="display:block;margin-bottom:6px">高亮角色（可多選）</label>
      <select id="roleSel" multiple>${opts}</select>
      <p class="note">手機：按住可多選；或點選後再點其他項</p>
    </div>`;
  let curAct='';
  RAW.forEach(l=>{
    if(l.act!==curAct){curAct=l.act;h+=`<div class="act-h">${l.act} · ${l.scene}</div>`;}
    const hl=l.spk.some(s=>st.hl.includes(s));
    h+=`<div class="sline ${hl?'hl':''}"><span class="spk">${l.spk.join(' & ')}</span><br>${l.tx}</div>`;
  });
  appEl.innerHTML=h;
  const sel=document.getElementById('roleSel');
  sel.onchange=()=>{
    st.hl=[...sel.selectedOptions].map(o=>o.value);
    // re-render highlight without full rebuild of select focus loss - full render is ok
    render();
  };
}

if(st.nick)loadMistakes().then(()=>render());else render();
  </script>
</body>
