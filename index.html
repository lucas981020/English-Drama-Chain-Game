<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>英語話劇台詞接龍 | Drama Chain</title>
  <style>
    :root {
      --bg: #0f1419; --card: #1a2332; --card2: #243044;
      --primary: #3b82f6; --primary-h: #2563eb;
      --success: #22c55e; --danger: #ef4444; --warn: #f59e0b;
      --text: #e2e8f0; --muted: #94a3b8; --border: #334155;
      --hl: #fbbf24; --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 16px 16px 80px; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    h2 { font-size: 1.2rem; margin-bottom: 12px; }
    h3 { font-size: 1rem; margin-bottom: 8px; }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .card {
      background: var(--card); border-radius: var(--radius); padding: 18px;
      margin-bottom: 14px; border: 1px solid var(--border);
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 13px 18px; border: none; border-radius: 10px; font-size: 0.95rem;
      font-weight: 600; cursor: pointer; width: 100%; min-height: 48px;
      transition: .15s; -webkit-user-select: none; user-select: none;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-h); }
    .btn-sec { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
    .btn-outline {
      background: transparent; border: 2px solid var(--border); color: var(--text);
    }
    .btn-outline.sel {
      border-color: var(--primary); background: rgba(59,130,246,.18); color: #93c5fd;
    }
    .btn-sm { padding: 9px 14px; font-size: .85rem; min-height: 38px; width: auto; }
    .btn-group { display: flex; flex-direction: column; gap: 10px; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (min-width: 480px) { .btn-grid { grid-template-columns: 1fr 1fr 1fr; } }
    .role-btn { padding: 11px 8px; font-size: .8rem; text-align: center; word-break: break-word; }
    .opt {
      background: var(--card2); border: 2px solid var(--border); border-radius: 10px;
      padding: 13px; cursor: pointer; font-size: .92rem; text-align: left; transition: .15s;
    }
    .opt:hover { border-color: var(--primary); }
    .opt.ok { border-color: var(--success); background: rgba(34,197,94,.15); }
    .opt.ng { border-color: var(--danger); background: rgba(239,68,68,.15); }
    .prev {
      background: var(--card2); border-left: 4px solid var(--primary);
      padding: 14px; border-radius: 0 10px 10px 0; margin-bottom: 16px;
    }
    .prev .spk { color: var(--primary); font-weight: 700; font-size: .85rem; margin-bottom: 2px; }
    .prev .tx { font-size: 1.02rem; }
    .bar {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 6px; margin-bottom: 12px; font-size: .85rem;
    }
    .chip { background: var(--card2); padding: 5px 11px; border-radius: 20px; }
    .chip b { color: var(--hl); }
    input[type=text] {
      width: 100%; padding: 13px; border: 2px solid var(--border); border-radius: 10px;
      background: var(--card2); color: var(--text); font-size: 1rem; outline: none;
    }
    input[type=text]:focus { border-color: var(--primary); }
    .chk-g { display: flex; flex-direction: column; gap: 6px; }
    .chk {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      background: var(--card2); border-radius: 8px; cursor: pointer;
    }
    .chk input { width: 18px; height: 18px; accent-color: var(--primary); }
    .rad-g { display: flex; flex-direction: column; gap: 6px; }
    .rad {
      display: flex; align-items: center; gap: 10px; padding: 11px 13px;
      background: var(--card2); border-radius: 8px; cursor: pointer;
      border: 2px solid transparent;
    }
    .rad.on { border-color: var(--primary); background: rgba(59,130,246,.12); }
    .rad input { width: 16px; height: 16px; accent-color: var(--primary); }
    .hidden { display: none !important; }
    .box {
      padding: 14px; border-radius: 10px; margin: 12px 0; text-align: center;
    }
    .box.ok { background: rgba(34,197,94,.15); border: 1px solid var(--success); }
    .box.ng { background: rgba(239,68,68,.15); border: 1px solid var(--danger); }
    .sline {
      padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: .92rem;
    }
    .sline.hl { background: rgba(251,191,36,.14); border-left: 3px solid var(--hl); }
    .sline .spk { color: var(--primary); font-weight: 600; }
    .sline.stage { color: var(--muted); font-style: italic; font-size: .85rem; background: rgba(148,163,184,.06); }
    .act-h {
      background: var(--card2); padding: 10px 14px; font-weight: 700;
      margin-top: 14px; border-radius: 8px; position: sticky; top: 0; z-index: 5;
    }
    .tabs { display: flex; gap: 4px; margin-bottom: 12px; overflow-x: auto; }
    .tab {
      padding: 9px 14px; background: var(--card2); border: none; border-radius: 8px;
      color: var(--muted); font-weight: 600; cursor: pointer; white-space: nowrap; font-size: .85rem;
    }
    .tab.on { background: var(--primary); color: #fff; }
    .mist {
      background: var(--card2); padding: 12px; border-radius: 8px; margin-bottom: 8px;
      font-size: .88rem; display: flex; gap: 10px; align-items: flex-start;
    }
    .badge {
      min-width: 24px; height: 24px; border-radius: 50%; background: var(--danger);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: .75rem; font-weight: 700; flex-shrink: 0;
    }
    .lb-item {
      display: flex; align-items: center; gap: 12px; padding: 11px;
      background: var(--card2); border-radius: 8px; margin-bottom: 6px;
    }
    .rank {
      width: 26px; height: 26px; border-radius: 50%; background: var(--border);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .8rem;
    }
    .rank.g { background: #fbbf24; color: #000; }
    .rank.s { background: #94a3b8; color: #000; }
    .rank.b { background: #b45309; color: #fff; }
    .nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
      border-top: 1px solid var(--border); display: flex; justify-content: space-around;
      padding: 6px 0; z-index: 100;
    }
    .nav button {
      background: none; border: none; color: var(--muted); font-size: .7rem;
      padding: 5px 10px; cursor: pointer; display: flex; flex-direction: column;
      align-items: center; gap: 1px;
    }
    .nav button.on { color: var(--primary); }
    .nav button span { font-size: 1.25rem; }
    .prog { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
    .prog > div { height: 100%; background: var(--primary); transition: width .3s; }
    .ac {
      position: absolute; background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; max-height: 140px; overflow-y: auto; width: 100%; z-index: 20;
    }
    .ac div { padding: 9px 12px; cursor: pointer; font-size: .88rem; }
    .ac div:hover { background: var(--card2); }
    .rel { position: relative; }
    .toast {
      position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
      background: var(--card); border: 1px solid var(--border); padding: 11px 18px;
      border-radius: 10px; z-index: 200; animation: fi .3s;
    }
    @keyframes fi { from { opacity: 0; transform: translateX(-50%) translateY(-8px); } }
    .empty { text-align: center; padding: 36px 16px; color: var(--muted); }
    .nick-gate {
      position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 300;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .nick-box {
      background: var(--card); border-radius: 14px; padding: 24px; width: 100%; max-width: 360px;
      border: 1px solid var(--border); text-align: center;
    }
    .seg {
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .seg .btn-outline { width: auto; flex: 1; min-width: 70px; padding: 10px 8px; font-size: .85rem; }
  </style>
</head>

  <script>

const RAW = [
  {act:"Act I",scene:"Scene 1",spk:["Narrator"],tx:"It was 1431. After being defeated in battle, Joan of Arc was captured by the English. Accused of twelve criminal charges, she was sentenced to death by burning.",nar:1},

  {act:"Act I",scene:"Scene 2",spk:["Gilles"],tx:"Joan... you saved me once. Now, I must find a way to bring you back. If only I could start over, I would protect you from all danger and suffering!",nar:0},
  {act:"Act I",scene:"Scene 2",spk:["Gilles"],tx:"My holy father... if thou wilt not answer, then allow the Dark Arts to guide me! I wish I could summon a person who can truly aid Joan. Grant me someone to save her! Amen!",nar:0},
  {act:"Act II",scene:"Scene 1",spk:["Narrator"],tx:"It is 2026. A group of high school students is visiting a local museum.",nar:1},
  {act:"Act II",scene:"Scene 1",spk:["Teacher"],tx:"Students, please look at this. This is one of the most famous figures in French history: Joan of Arc. In the 15th century, she led the French army against the English and was regarded as a national hero. However, unfortunately, she was eventually captured and convicted of heresy at the age of nineteen.",nar:0},
  {act:"Act II",scene:"Scene 1",spk:["Teacher"],tx:"In the end, she was burned at the stake!",nar:0},

  {act:"Act II",scene:"Scene 1",spk:["Tim"],tx:"Yew…It even bears a weird smell.",nar:0},
  {act:"Act II",scene:"Scene 1",spk:["Tim"],tx:"Well... one quick peek shouldn't hurt, right?",nar:0},
  {act:"Act II",scene:"Scene 1",spk:["Tim"],tx:"Oh my goodness!",nar:0},
  {act:"Act III",scene:"Scene 1",spk:["Narrator"],tx:"It was 1431, the Battle of Jargeau, when there were merely two weeks remaining from the execution of Joan of Arc. In a fog-surrounded forest, the French army lies in wait, with their movements ghostly and silent.",nar:1},
  {act:"Act III",scene:"Scene 1",spk:["Gilles"],tx:"It was legendary for you to be so brave in the battle last week. It's hard to believe that you were just a simple country girl a year ago.",nar:0},
  {act:"Act III",scene:"Scene 1",spk:["Joan"],tx:"These victories are all the will of God. It is He who guides me through these battles.",nar:0},

  {act:"Act V",scene:"Scene 1",spk:["Narrator"],tx:"Against the odds, the French have secured a temporary victory. Grateful and curious about the \"miracle-working\" Tim, Joan, and her commanders invite him to join their victory feast. The camp is alive with energy as soldiers sing and enjoy a hard-earned meal.",nar:1},

  {act:"Act V",scene:"Scene 1",spk:["Joan"],tx:"I was once a simple girl from the countryside. But one day, I heard the voices of the Saints.",nar:0},

/* ========== Storage / State ========== */
const S = {
  get(k,d){ try{ const v=localStorage.getItem('edcg_'+k); return v?JSON.parse(v):d; }catch{return d;} },
  set(k,v){ localStorage.setItem('edcg_'+k,JSON.stringify(v)); }
};
let st = {
  screen:'home', roleMode:'all', myRoles:[], ansMode:'mc',
  acts:[...ACTS], qCount:'all', queue:[], idx:0,
  selSpk:[], spkDone:0, spkOk:0, lineDone:0, lineOk:0,
  opts:[], input:'', ss:0, ls:0, total:0,
  nick:S.get('nick',''), hl:[],
};

function norm(s){ return (s||'').toLowerCase().replace(/[^\w\s]/g,'').replace(/\s+/g,' ').trim(); }
function lev(a,b){
  const m=a.length,n=b.length, dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i; for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
function close(a,b){
  a=norm(a);b=norm(b); if(a===b)return 1;
  if(a.length<3)return 0;
  return lev(a,b)<=Math.max(2,Math.floor(Math.max(a.length,b.length)*.15));
}
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(m){ const e=document.createElement('div'); e.className='toast'; e.textContent=m; document.body.appendChild(e); setTimeout(()=>e.remove(),2000); }

function buildQ(){
  const lines=RAW.filter(l=>st.acts.includes(l.act));
  const pairs=[];
  for(let i=0;i<lines.length-1;i++){
    const p=lines[i], n=lines[i+1];
    if(n.i!==p.i+1) continue;
    if(st.roleMode==='mine'){
      // 只出「下一句是自己角色」的題
      if(!n.spk.some(s=>st.myRoles.includes(s))) continue;
    }
    pairs.push({p,n});
  }
  let q=shuffle(pairs);
  if(st.qCount!=='all') q=q.slice(0,+st.qCount);
  return q;
}
function mcOpts(correct){
  const others=RAW.map(l=>l.tx).filter(t=>t!==correct);
  const scored=others.map(t=>({t,s:Math.abs(t.length-correct.length)+Math.random()*20})).sort((a,b)=>a.s-b.s);
  return shuffle([correct,...scored.slice(0,3).map(x=>x.t)]);
}
function recMist(type,prev,correct){
  const k=type==='spk'?'m_spk':'m_line';
  const list=S.get(k,[]);
  const id=prev.i+'|'+(type==='spk'?correct.join(','):correct);
  const ex=list.find(m=>m.id===id);
  if(ex) ex.c++; else list.push({id,ps:prev.spk,pt:prev.tx,c:1,ok:correct});
  list.sort((a,b)=>b.c-a.c); S.set(k,list);
}
function saveScore(){
  if(!st.nick) return;
  const k=`lb_${st.roleMode}_${st.ansMode}`;
  const board=S.get(k,[]);
  const e={name:st.nick,spk:st.ss,line:st.ls,total:st.ss+st.ls,date:new Date().toISOString(),n:st.total};
  const i=board.findIndex(x=>x.name===st.nick);
  if(i>=0){ if(e.total>board[i].total) board[i]=e; } else board.push(e);
  board.sort((a,b)=>b.total-a.total); S.set(k,board.slice(0,50));
}

function startQ(){
  st.selSpk=[]; st.spkDone=0; st.spkOk=0; st.lineDone=0; st.lineOk=0; st.input='';
  const {n}=st.queue[st.idx];
  if(st.ansMode==='mc') st.opts=mcOpts(n.tx);
  // 我的角色模式：直接跳過選角色
  if(st.roleMode==='mine'){
    st.spkDone=1; st.spkOk=1; st.ss++; st.total++;
  }
  st.screen='quiz'; render();
}

function rQuiz(){
  const q=st.queue[st.idx]; if(!q){ go('result'); return; }
  const {p,n}=q;
  const pct=(st.idx/st.queue.length)*100;
  let spkH='', lineH='';

  // 選角色（全角色模式才顯示）
  if(st.roleMode==='all' && !st.spkDone){
    const btns=ALL_SPK.map(s=>`<button class="btn btn-outline role-btn ${st.selSpk.includes(s)?'sel':''}" data-r="${s}">${s}</button>`).join('');
    spkH=`<div class="card"><h3>👤 下一句是誰？</h3>
      <div class="btn-grid">${btns}</div>
      <button class="btn btn-primary" id="subSpk" style="margin-top:12px">✓</button></div>`;
  } else if(st.roleMode==='all' && st.spkDone){
    spkH=`<div class="box ${st.spkOk?'ok':'ng'}">${st.spkOk?'✅':'❌'} ${n.spk.join(' & ')}</div>`;
  }

  // 台詞
  if(st.spkDone && !st.lineDone){
    if(st.ansMode==='mc'){
      lineH=`<div class="card"><h3>💬 下一句？</h3>
        <div style="display:flex;flex-direction:column;gap:8px">${st.opts.map((t,i)=>`<div class="opt" data-i="${i}">${t}</div>`).join('')}</div></div>`;
    } else {
      lineH=`<div class="card"><h3>💬 下一句？</h3>
        <div class="rel"><input type="text" id="lin" placeholder="輸入台詞…" value="${st.input}">
        <div class="ac hidden" id="ac"></div></div>
        <button class="btn btn-primary" id="subL" style="margin-top:10px">✓</button></div>`;
    }
  } else if(st.lineDone){
    lineH=`<div class="box ${st.lineOk?'ok':'ng'}">${st.lineOk?'✅':'❌'} <em>${n.tx}</em></div>
      <button class="btn btn-primary" id="next">→</button>`;
  }

  app.innerHTML=`
    <div class="bar">
      <div class="chip">${st.idx+1}/${st.queue.length}</div>
      <div class="chip">👤 <b>${st.ss}</b></div>
      <div class="chip">💬 <b>${st.ls}</b></div>
    </div>
    <div class="prog"><div style="width:${pct}%"></div></div>
    <div class="prev"><div class="spk">${p.spk.join(' & ')}</div><div class="tx">${p.tx}</div></div>
    ${spkH}${lineH}`;

  if(st.roleMode==='all' && !st.spkDone){
    document.querySelectorAll('.role-btn').forEach(b=>b.onclick=()=>{
      const r=b.dataset.r;
      st.selSpk=st.selSpk.includes(r)?st.selSpk.filter(x=>x!==r):[...st.selSpk,r];
      render();
    });
    document.getElementById('subSpk').onclick=()=>{
      const ok=n.spk.length===st.selSpk.length && n.spk.every(s=>st.selSpk.includes(s));
      st.spkOk=ok; st.spkDone=1;
      if(ok) st.ss++; else recMist('spk',p,n.spk);
      st.total++; render();
    };
  }
  if(st.spkDone && !st.lineDone && st.ansMode==='mc'){
    document.querySelectorAll('.opt').forEach(c=>c.onclick=()=>{
      const chosen=st.opts[+c.dataset.i];
      st.lineOk=chosen===n.tx; st.lineDone=1;
      if(st.lineOk) st.ls++; else recMist('line',p,n.tx);
      document.querySelectorAll('.opt').forEach((x,i)=>{
        if(st.opts[i]===n.tx) x.classList.add('ok');
        else if(i===+c.dataset.i) x.classList.add('ng');
      });
      setTimeout(()=>render(),500);
    });
  }
  if(st.spkDone && !st.lineDone && st.ansMode==='input'){
    const inp=document.getElementById('lin'), ac=document.getElementById('ac');
    inp.focus();
    inp.oninput=()=>{
      st.input=inp.value; const v=norm(inp.value);
      if(v.length<2){ ac.classList.add('hidden'); return; }
      const sug=RAW.map(l=>l.tx).filter(t=>norm(t).includes(v)||t.toLowerCase().startsWith(inp.value.toLowerCase())).slice(0,5);
      if(sug.length){ ac.innerHTML=sug.map(s=>`<div data-s="${s.replace(/"/g,'&quot;')}">${s}</div>`).join(''); ac.classList.remove('hidden');
        ac.querySelectorAll('div').forEach(d=>d.onclick=()=>{ inp.value=d.dataset.s; st.input=d.dataset.s; ac.classList.add('hidden'); });
      } else ac.classList.add('hidden');
    };
    document.getElementById('subL').onclick=()=>{
      const v=inp.value.trim(); if(!v){ toast('請輸入'); return; }
      if(close(v,n.tx)){
        if(norm(v)===norm(n.tx) || confirm(`「${n.tx}」\n\n確定？`)){
          st.lineOk=1; st.lineDone=1; st.ls++; render();
        }
      } else { st.lineOk=0; st.lineDone=1; recMist('line',p,n.tx); render(); }
    };
    inp.onkeydown=e=>{ if(e.key==='Enter') document.getElementById('subL').click(); };
  }
  if(st.lineDone){
    document.getElementById('next').onclick=()=>{
      st.idx++;
      if(st.idx>=st.queue.length){ saveScore(); go('result'); }
      else startQ();
    };
  }
}

      </div>
      <p class="muted">${st.queue.length} 題 · ${st.roleMode==='mine'?'我的角色':'全角色'} · ${st.ansMode==='mc'?'四選一':'整句'}</p>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" id="a1">再練</button>
      <button class="btn btn-sec" id="a2">🏠</button>
      <button class="btn btn-sec" id="a3">📕</button>
    </div>`;
  document.getElementById('a1').onclick=()=>go('practice');
  document.getElementById('a2').onclick=()=>go('home');
  document.getElementById('a3').onclick=()=>go('mistakes');
}

function rMist(){
  const sp=S.get('m_spk',[]), ln=S.get('m_line',[]);
  app.innerHTML=`
    <h2>📕 錯題</h2>
    <div class="tabs">
      <button class="tab on" data-t="spk">👤 ${sp.length}</button>
      <button class="tab" data-t="line">💬 ${ln.length}</button>
    </div>
    <div id="ml"></div>`;
  const ml=document.getElementById('ml');
  function show(t){
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
    const d=t==='spk'?sp:ln;
    if(!d.length){ ml.innerHTML='<div class="empty">🎉</div>'; return; }
    ml.innerHTML=d.map(m=>`
      <div class="mist">
        <div class="badge">${m.c}</div>
        <div style="flex:1">
          <div class="muted" style="font-size:.78rem;margin-bottom:3px">${m.ps.join(' & ')} — ${m.pt.slice(0,50)}${m.pt.length>50?'…':''}</div>
          <div><b>${Array.isArray(m.ok)?m.ok.join(' & '):m.ok}</b></div>
        </div>
      </div>`).join('');
  }
  show('spk');
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>show(t.dataset.t));
}

function rLB(){
  const modes=[{k:'mine_mc',l:'我的·四選一'},{k:'mine_input',l:'我的·整句'},{k:'all_mc',l:'全·四選一'},{k:'all_input',l:'全·整句'}];
  app.innerHTML=`
    <h2>🏆 排行</h2>
    <div class="tabs" id="lt">${modes.map((m,i)=>`<button class="tab ${i===0?'on':''}" data-k="${m.k}">${m.l}</button>`).join('')}</div>
    <div id="ll"></div>
    <div class="card" style="margin-top:12px">
      <button class="btn btn-sm btn-outline" id="ex" style="width:auto;margin-right:6px">📤 匯出</button>
      <button class="btn btn-sm btn-outline" id="im" style="width:auto">📥 匯入</button>
    </div>`;
  function show(k){
    document.querySelectorAll('#lt .tab').forEach(t=>t.classList.toggle('on',t.dataset.k===k));
    const b=S.get('lb_'+k,[]);
    const ll=document.getElementById('ll');
    if(!b.length){ ll.innerHTML='<div class="empty">—</div>'; return; }
    ll.innerHTML=b.map((e,i)=>`
      <div class="lb-item">
        <div class="rank ${i===0?'g':i===1?'s':i===2?'b':''}">${i+1}</div>
        <div style="flex:1"><b>${e.name}</b><div class="muted" style="font-size:.75rem">👤${e.spk} 💬${e.line}</div></div>
        <b style="color:var(--hl)">${e.total}</b>
      </div>`).join('');
  }
  show('mine_mc');
  document.querySelectorAll('#lt .tab').forEach(t=>t.onclick=()=>show(t.dataset.k));
  document.getElementById('ex').onclick=()=>{
    const d={}; modes.forEach(m=>d[m.k]=S.get('lb_'+m.k,[]));
    const s=JSON.stringify(d);
    navigator.clipboard.writeText(s).then(()=>toast('已複製')).catch(()=>prompt('複製：',s));
  };
  document.getElementById('im').onclick=()=>{
    const s=prompt('貼上 JSON：'); if(!s)return;
    try{
      const d=JSON.parse(s);
      modes.forEach(m=>{
        if(d[m.k]){
          const ex=S.get('lb_'+m.k,[]); const map={};
          [...ex,...d[m.k]].forEach(e=>{ if(!map[e.name]||e.total>map[e.name].total) map[e.name]=e; });
          S.set('lb_'+m.k,Object.values(map).sort((a,b)=>b.total-a.total).slice(0,50));
        }
      });
      toast('成功'); render();
    }catch{ toast('格式錯誤'); }
  };
}

function rScript(){
  const chk=ALL_SPK.map(r=>`<label class="chk" style="padding:5px 8px"><input type="checkbox" value="${r}" ${st.hl.includes(r)?'checked':''} class="hlc"> ${r}</label>`).join('');
  let h=`<h2>📖 劇本</h2>
    <div class="card"><div class="chk-g" style="max-height:120px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:3px">${chk}</div></div>`;
  SCRIPT.forEach(x=>{
    if(x.t==='h') h+=`<div class="act-h">${x.a}<div class="muted" style="font-weight:400;font-size:.8rem">${x.s||''}</div></div>`;
    else if(x.t==='st') h+=`<div class="sline stage">${x.tx}</div>`;
    else {
      const hl=x.spk.some(s=>st.hl.includes(s));
      h+=`<div class="sline ${hl?'hl':''}"><span class="spk">${x.spk.join(' & ')}</span>${x.act?` <span class="muted" style="font-size:.78rem">${x.act}</span>`:''}<br>${x.tx}</div>`;
    }
  });
  app.innerHTML=h;
  document.querySelectorAll('.hlc').forEach(c=>c.onchange=()=>{ st.hl=[...document.querySelectorAll('.hlc:checked')].map(x=>x.value); render(); });
}

render();
  </script>
</body>
