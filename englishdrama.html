<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>英語話劇台詞接龍練習器 | English Drama Chain Game</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --card2: #243044;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #334155;
      --highlight: #fbbf24;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
      padding-bottom: 80px;
    }
    h1, h2, h3 { font-weight: 700; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    h2 { font-size: 1.25rem; margin-bottom: 12px; }
    h3 { font-size: 1.1rem; margin-bottom: 8px; }
    .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      width: 100%;
      min-height: 48px;
      -webkit-user-select: none;
      user-select: none;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover, .btn-primary:focus { background: var(--primary-hover); }
    .btn-secondary { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #2d3a4f; }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-outline {
      background: transparent;
      border: 2px solid var(--border);
      color: var(--text);
    }
    .btn-outline.active {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
    }
    .btn-sm { padding: 10px 14px; font-size: 0.9rem; min-height: 40px; }
    .btn-group { display: flex; flex-direction: column; gap: 10px; }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (min-width: 480px) {
      .btn-grid { grid-template-columns: 1fr 1fr 1fr; }
    }
    .role-btn {
      padding: 12px 10px;
      font-size: 0.85rem;
      text-align: center;
      word-break: break-word;
    }
    .role-btn.selected {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
    }
    .role-btn.correct {
      border-color: var(--success);
      background: rgba(34, 197, 94, 0.2);
      color: #86efac;
    }
    .role-btn.wrong {
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }
    .option-card {
      background: var(--card2);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
      font-size: 0.95rem;
    }
    .option-card:hover { border-color: var(--primary); }
    .option-card.selected { border-color: var(--primary); background: rgba(59,130,246,0.15); }
    .option-card.correct { border-color: var(--success); background: rgba(34,197,94,0.15); }
    .option-card.wrong { border-color: var(--danger); background: rgba(239,68,68,0.15); }
    .prev-line {
      background: var(--card2);
      border-left: 4px solid var(--primary);
      padding: 16px;
      border-radius: 0 10px 10px 0;
      margin-bottom: 20px;
    }
    .prev-line .speaker { color: var(--primary); font-weight: 700; margin-bottom: 4px; }
    .prev-line .text { font-size: 1.05rem; }
    .score-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }
    .score-item { background: var(--card2); padding: 6px 12px; border-radius: 20px; }
    .score-item strong { color: var(--highlight); }
    input[type="text"], textarea {
      width: 100%;
      padding: 14px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--card2);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    input[type="text"]:focus, textarea:focus { border-color: var(--primary); }
    .checkbox-group { display: flex; flex-direction: column; gap: 8px; }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--card2);
      border-radius: 8px;
      cursor: pointer;
    }
    .checkbox-item input { width: 20px; height: 20px; accent-color: var(--primary); }
    .radio-group { display: flex; flex-direction: column; gap: 8px; }
    .radio-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: var(--card2);
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .radio-item.selected { border-color: var(--primary); background: rgba(59,130,246,0.1); }
    .radio-item input { width: 18px; height: 18px; accent-color: var(--primary); }
    .hidden { display: none !important; }
    .result-box {
      padding: 16px;
      border-radius: 10px;
      margin: 16px 0;
      text-align: center;
    }
    .result-box.correct { background: rgba(34,197,94,0.15); border: 1px solid var(--success); }
    .result-box.wrong { background: rgba(239,68,68,0.15); border: 1px solid var(--danger); }
    .result-box.partial { background: rgba(245,158,11,0.15); border: 1px solid var(--warning); }
    .script-line {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }
    .script-line.highlight {
      background: rgba(251, 191, 36, 0.15);
      border-left: 3px solid var(--highlight);
    }
    .script-line .spk { color: var(--primary); font-weight: 600; }
    .act-header {
      background: var(--card2);
      padding: 12px 16px;
      font-weight: 700;
      margin-top: 16px;
      border-radius: 8px;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .tab {
      padding: 10px 16px;
      background: var(--card2);
      border: none;
      border-radius: 8px;
      color: var(--text-muted);
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.9rem;
    }
    .tab.active { background: var(--primary); color: white; }
    .mistake-item {
      background: var(--card2);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }
    .mistake-item .count {
      display: inline-block;
      background: var(--danger);
      color: white;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
      margin-left: 8px;
    }
    .leaderboard-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--card2);
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .rank {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .rank.gold { background: #fbbf24; color: #000; }
    .rank.silver { background: #94a3b8; color: #000; }
    .rank.bronze { background: #b45309; color: #fff; }
    .nav-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      z-index: 100;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 6px 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .nav-btn.active { color: var(--primary); }
    .nav-btn span { font-size: 1.3rem; }
    .progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      transition: width 0.3s;
    }
    .autocomplete {
      position: absolute;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 150px;
      overflow-y: auto;
      width: 100%;
      z-index: 20;
      box-shadow: var(--shadow);
    }
    .autocomplete div {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .autocomplete div:hover { background: var(--card2); }
    .relative { position: relative; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-blue { background: rgba(59,130,246,0.2); color: #93c5fd; }
    .badge-green { background: rgba(34,197,94,0.2); color: #86efac; }
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card);
      border: 1px solid var(--border);
      padding: 12px 20px;
      border-radius: 10px;
      z-index: 200;
      box-shadow: var(--shadow);
      animation: fadeIn 0.3s;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
    .filter-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tag {
      padding: 4px 10px;
      background: var(--card2);
      border-radius: 20px;
      font-size: 0.8rem;
      border: 1px solid var(--border);
    }
    .tag.active { background: var(--primary); border-color: var(--primary); }
  </style>
</head>

// ===================== UTILS =====================
function normalize(str) {
  return (str || '')
    .toLowerCase()
    .replace(/[^\w\s]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i-1] === b[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}

function isCloseMatch(input, correct) {
  const a = normalize(input);
  const b = normalize(correct);
  if (a === b) return true;
  if (a.length < 3) return false;
  const dist = levenshtein(a, b);
  const maxLen = Math.max(a.length, b.length);
  return dist <= Math.max(2, Math.floor(maxLen * 0.15));
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function toast(msg, ms = 2000) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

// ===================== QUIZ LOGIC =====================
function buildQuizQueue() {
  const lines = RAW_LINES.filter(l => state.selectedActs.includes(l.act));
  const pairs = [];
  for (let i = 0; i < lines.length - 1; i++) {
    const prev = lines[i];
    const next = lines[i + 1];
    if (next.order !== prev.order + 1) continue;
    if (state.roleMode === 'mine') {
      const related = [...prev.speakers, ...next.speakers].some(s => state.myRoles.includes(s));
      if (!related) continue;
    }
    pairs.push({ prev, next });
  }
  return shuffle(pairs);
}

function getMCOptions(correctText) {
  const others = RAW_LINES
    .map(l => l.text)
    .filter(t => t !== correctText);
  const targetLen = correctText.length;
  const scored = others.map(t => ({
    t,
    score: Math.abs(t.length - targetLen) + Math.random() * 20
  })).sort((a, b) => a.score - b.score);
  const distractors = scored.slice(0, 3).map(x => x.t);
  return shuffle([correctText, ...distractors]);
}

function recordMistake(type, prevLine, correct, wrong) {
  const key = type === 'speaker' ? 'mistakes_speaker' : 'mistakes_line';
  const list = Storage.get(key, []);
  const id = prevLine.order + '|' + (type === 'speaker' ? correct.join(',') : correct);
  const existing = list.find(m => m.id === id);
  if (existing) {
    existing.count++;
    existing.lastWrong = wrong;
  } else {
    list.push({
      id,
      prevSpeakers: prevLine.speakers,
      prevText: prevLine.text,
      correct,
      lastWrong: wrong,
      count: 1
    });
  }
  list.sort((a, b) => b.count - a.count);
  Storage.set(key, list);
}

function saveSessionScore() {
  if (!state.nickname) return;
  const key = `lb_${state.roleMode}_${state.answerMode}`;
  const board = Storage.get(key, []);
  const entry = {
    name: state.nickname,
    speaker: state.sessionSpeakerScore,
    line: state.sessionLineScore,
    total: state.sessionSpeakerScore + state.sessionLineScore,
    date: new Date().toISOString(),
    answered: state.sessionTotal
  };
  const idx = board.findIndex(e => e.name === state.nickname);
  if (idx >= 0) {
    if (entry.total > board[idx].total) board[idx] = entry;
  } else {
    board.push(entry);
  }
  board.sort((a, b) => b.total - a.total);
  Storage.set(key, board.slice(0, 50));
}

    </div>
    <button class="btn btn-primary" id="btnGo">開始答題！</button>
    <button class="btn btn-secondary" id="btnBack" style="margin-top:10px">返回</button>
  `;

  document.querySelectorAll('input[name="roleMode"]').forEach(r => {
    r.onchange = () => {
      state.roleMode = r.value;
      document.getElementById('myRolesBox').classList.toggle('hidden', r.value !== 'mine');
      document.querySelectorAll('.radio-item').forEach(el => {
        if (el.querySelector('input[name="roleMode"]')) {
          el.classList.toggle('selected', el.querySelector('input').checked);
        }
      });
    };
  });
  document.querySelectorAll('input[name="answerMode"]').forEach(r => {
    r.onchange = () => {
      state.answerMode = r.value;
      document.querySelectorAll('.radio-item').forEach(el => {
        if (el.querySelector('input[name="answerMode"]')) {
          el.classList.toggle('selected', el.querySelector('input').checked);
        }
      });
    };
  });
  document.querySelectorAll('.role-cb').forEach(cb => {
    cb.onchange = () => {
      state.myRoles = [...document.querySelectorAll('.role-cb:checked')].map(c => c.value);
    };
  });
  document.querySelectorAll('.act-cb').forEach(cb => {
    cb.onchange = () => {
      state.selectedActs = [...document.querySelectorAll('.act-cb:checked')].map(c => c.value);
    };
  });
  document.getElementById('btnAllActs').onclick = () => {
    const all = document.querySelectorAll('.act-cb');
    const checked = [...all].every(c => c.checked);
    all.forEach(c => c.checked = !checked);
    state.selectedActs = checked ? [] : [...ACTS];
  };
  document.getElementById('btnBack').onclick = () => setScreen('home');
  document.getElementById('btnGo').onclick = () => {
    if (state.selectedActs.length === 0) {
      toast('請至少選擇一個 Act');
      return;
    }
    if (state.roleMode === 'mine' && state.myRoles.length === 0) {
      toast('請至少勾選一個自己的角色');
      return;
    }
    state.quizQueue = buildQuizQueue();
    if (state.quizQueue.length === 0) {
      toast('目前條件下沒有可練習的題目，請調整範圍');
      return;
    }
    state.currentIdx = 0;
    state.sessionSpeakerScore = 0;
    state.sessionLineScore = 0;
    state.sessionTotal = 0;
    state.selectedSpeakers = [];
    state.speakerAnswered = false;
    state.lineAnswered = false;
    startQuestion();
  };
}

function startQuestion() {
  state.selectedSpeakers = [];
  state.speakerAnswered = false;
  state.speakerCorrect = false;
  state.lineAnswered = false;
  state.lineCorrect = false;
  state.inputValue = '';
  const { next } = state.quizQueue[state.currentIdx];
  if (state.answerMode === 'mc') {
    state.mcOptions = getMCOptions(next.text);
  }
  state.screen = 'quiz';
  render();
}

function renderQuiz() {
  const q = state.quizQueue[state.currentIdx];
  if (!q) {
    setScreen('result');
    return;
  }
  const { prev, next } = q;
  const progress = ((state.currentIdx) / state.quizQueue.length) * 100;

  let speakerSection = '';
  if (!state.speakerAnswered) {
    const buttons = ALL_SPEAKERS.map(s => `
      <button class="btn btn-outline role-btn ${state.selectedSpeakers.includes(s) ? 'selected' : ''}" data-role="${s}">${s}</button>
    `).join('');
    speakerSection = `
      <div class="card">
        <h3>第一小題：下一位角色是誰？</h3>
        <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:12px">可複選（合講時需選全部正確角色）</p>
        <div class="btn-grid">${buttons}</div>
        <button class="btn btn-primary" id="btnSubmitSpeaker" style="margin-top:16px">確認角色</button>
      </div>
    `;
  } else {
    const selectedSet = new Set(state.selectedSpeakers);
    const isCorrect = next.speakers.length === state.selectedSpeakers.length &&
      next.speakers.every(s => selectedSet.has(s));
    speakerSection = `
      <div class="result-box ${isCorrect ? 'correct' : 'wrong'}">
        <strong>${isCorrect ? '✅ 角色正確！' : '❌ 角色錯誤'}</strong><br>
        正確：${next.speakers.join(' & ')}
        ${!isCorrect ? `<br>你選：${state.selectedSpeakers.join(' & ') || '（未選）'}` : ''}
      </div>
    `;
  }

  let lineSection = '';
  if (state.speakerAnswered && !state.lineAnswered) {
    if (state.answerMode === 'mc') {
      const opts = state.mcOptions.map((t, i) => `
        <div class="option-card" data-idx="${i}">${t}</div>
      `).join('');
      lineSection = `
        <div class="card">
          <h3>第二小題：下一句台詞是什麼？</h3>
          <div style="display:flex;flex-direction:column;gap:10px">${opts}</div>
        </div>
      `;
    } else {
      lineSection = `
        <div class="card">
          <h3>第二小題：下一句台詞是什麼？</h3>
          <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:8px">大小寫、標點、空格不計分</p>
          <div class="relative">
            <input type="text" id="lineInput" placeholder="輸入下一句台詞..." autocomplete="off" value="${state.inputValue}">
            <div class="autocomplete hidden" id="acBox"></div>
          </div>
          <button class="btn btn-primary" id="btnSubmitLine" style="margin-top:12px">送出</button>
        </div>
      `;
    }
  } else if (state.lineAnswered) {
    lineSection = `
      <div class="result-box ${state.lineCorrect ? 'correct' : 'wrong'}">
        <strong>${state.lineCorrect ? '✅ 台詞正確！' : '❌ 台詞錯誤'}</strong><br>
        正確答案：<em>${next.text}</em>
      </div>
      <button class="btn btn-primary" id="btnNext">下一題 →</button>
    `;
  }

  app.innerHTML = `
    <div class="score-bar">
      <div class="score-item">題目 ${state.currentIdx + 1} / ${state.quizQueue.length}</div>
      <div class="score-item">角色 <strong>${state.sessionSpeakerScore}</strong></div>
      <div class="score-item">台詞 <strong>${state.sessionLineScore}</strong></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="prev-line">
      <div class="speaker">${prev.speakers.join(' & ')}</div>
      <div class="text">${prev.text}</div>
    </div>
    ${speakerSection}
    ${lineSection}
  `;

  if (!state.speakerAnswered) {
    document.querySelectorAll('.role-btn').forEach(btn => {
      btn.onclick = () => {
        const role = btn.dataset.role;
        if (state.selectedSpeakers.includes(role)) {
          state.selectedSpeakers = state.selectedSpeakers.filter(s => s !== role);
        } else {
          state.selectedSpeakers.push(role);
        }
        render();
      };
    });
    document.getElementById('btnSubmitSpeaker').onclick = () => {
      const selectedSet = new Set(state.selectedSpeakers);
      state.speakerCorrect = next.speakers.length === state.selectedSpeakers.length &&
        next.speakers.every(s => selectedSet.has(s));
      state.speakerAnswered = true;
      if (state.speakerCorrect) {
        state.sessionSpeakerScore++;
      } else {
        recordMistake('speaker', prev, next.speakers, state.selectedSpeakers);
      }
      state.sessionTotal++;
      render();
    };
  }

  if (state.speakerAnswered && !state.lineAnswered && state.answerMode === 'mc') {
    document.querySelectorAll('.option-card').forEach(card => {
      card.onclick = () => {
        const idx = +card.dataset.idx;
        const chosen = state.mcOptions[idx];
        state.lineCorrect = chosen === next.text;
        state.lineAnswered = true;
        if (state.lineCorrect) {
          state.sessionLineScore++;
        } else {
          recordMistake('line', prev, next.text, chosen);
        }
        document.querySelectorAll('.option-card').forEach((c, i) => {
          if (state.mcOptions[i] === next.text) c.classList.add('correct');
          else if (i === idx) c.classList.add('wrong');
        });
        setTimeout(() => render(), 600);
      };
    });
  }

  if (state.speakerAnswered && !state.lineAnswered && state.answerMode === 'input') {
    const input = document.getElementById('lineInput');
    const acBox = document.getElementById('acBox');
    input.focus();
    input.oninput = () => {
      state.inputValue = input.value;
      const val = normalize(input.value);
      if (val.length < 2) {
        acBox.classList.add('hidden');
        return;
      }
      const suggestions = RAW_LINES
        .map(l => l.text)
        .filter(t => normalize(t).includes(val) || t.toLowerCase().startsWith(input.value.toLowerCase()))
        .slice(0, 5);
      if (suggestions.length) {
        acBox.innerHTML = suggestions.map(s => `<div data-s="${s.replace(/"/g, '&quot;')}">${s}</div>`).join('');
        acBox.classList.remove('hidden');
        acBox.querySelectorAll('div').forEach(d => {
          d.onclick = () => {
            input.value = d.dataset.s;
            state.inputValue = d.dataset.s;
            acBox.classList.add('hidden');
          };
        });
      } else {
        acBox.classList.add('hidden');
      }
    };
    document.getElementById('btnSubmitLine').onclick = () => {
      const val = input.value.trim();
      if (!val) { toast('請輸入台詞'); return; }
      if (isCloseMatch(val, next.text)) {
        if (normalize(val) === normalize(next.text)) {
          state.lineCorrect = true;
          state.lineAnswered = true;
          state.sessionLineScore++;
          render();
        } else {
          if (confirm(`你是不是要打：\n\n「${next.text}」\n\n按「確定」視為正確，按「取消」重新輸入`)) {
            state.lineCorrect = true;
            state.lineAnswered = true;
            state.sessionLineScore++;
            render();
          }
        }
      } else {
        state.lineCorrect = false;
        state.lineAnswered = true;
        recordMistake('line', prev, next.text, val);
        render();
      }
    };
    input.onkeydown = e => {
      if (e.key === 'Enter') document.getElementById('btnSubmitLine').click();
    };
  }

  if (state.lineAnswered) {
    document.getElementById('btnNext').onclick = () => {
      state.currentIdx++;
      if (state.currentIdx >= state.quizQueue.length) {
        saveSessionScore();
        setScreen('result');
      } else {
        startQuestion();
      }
    };
  }
}

function renderResult() {
  const totalQ = state.quizQueue.length;
  const sp = state.sessionSpeakerScore;
  const ln = state.sessionLineScore;
  app.innerHTML = `
    <h2>本回合結束！</h2>
    <div class="card" style="text-align:center">
      <p style="font-size:1.2rem;margin-bottom:16px">共 ${totalQ} 題</p>
      <div style="display:flex;justify-content:center;gap:24px;margin-bottom:20px">
        <div>
          <div style="font-size:2rem;font-weight:700;color:var(--highlight)">${sp}</div>
          <div style="color:var(--text-muted)">角色正確</div>
        </div>
        <div>
          <div style="font-size:2rem;font-weight:700;color:var(--highlight)">${ln}</div>
          <div style="color:var(--text-muted)">台詞正確</div>
        </div>
      </div>
      <p style="color:var(--text-muted);font-size:0.9rem">模式：${state.roleMode === 'mine' ? '我的角色' : '全角色'} / ${state.answerMode === 'mc' ? '四選一' : '整句輸入'}</p>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" id="btnAgain">再練一次</button>
      <button class="btn btn-secondary" id="btnHome">回首頁</button>
      <button class="btn btn-secondary" id="btnMistakes">查看錯題本</button>
    </div>
  `;
  document.getElementById('btnAgain').onclick = () => setScreen('practice');
  document.getElementById('btnHome').onclick = () => setScreen('home');
  document.getElementById('btnMistakes').onclick = () => setScreen('mistakes');
}

function renderMistakes() {
  const spMistakes = Storage.get('mistakes_speaker', []);
  const lnMistakes = Storage.get('mistakes_line', []);
  app.innerHTML = `
    <h2>📕 錯題本</h2>
    <div class="tabs">
      <button class="tab active" data-tab="speaker">角色錯誤 (${spMistakes.length})</button>
      <button class="tab" data-tab="line">台詞錯誤 (${lnMistakes.length})</button>
    </div>
    <div id="mistakeList"></div>
    <button class="btn btn-secondary" id="btnClearMistakes" style="margin-top:16px">清除全部錯題</button>
  `;
  const listEl = document.getElementById('mistakeList');
  function showTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    const data = tab === 'speaker' ? spMistakes : lnMistakes;
    if (data.length === 0) {
      listEl.innerHTML = '<div class="empty-state">目前沒有錯題，很棒！</div>';
      return;
    }
    listEl.innerHTML = data.map(m => `
      <div class="mistake-item">
        <div style="color:var(--text-muted);font-size:0.8rem;margin-bottom:4px">上一句：${m.prevSpeakers.join(' & ')} — ${m.prevText.slice(0, 60)}${m.prevText.length > 60 ? '…' : ''}</div>
        <div><strong>正確：</strong>${Array.isArray(m.correct) ? m.correct.join(' & ') : m.correct}</div>
        <div style="color:var(--danger);font-size:0.85rem">你上次答：${Array.isArray(m.lastWrong) ? m.lastWrong.join(' & ') : m.lastWrong}</div>
        <span class="count">錯 ${m.count} 次</span>
      </div>
    `).join('');
  }
  showTab('speaker');
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => showTab(t.dataset.tab));
  document.getElementById('btnClearMistakes').onclick = () => {
    if (confirm('確定清除所有錯題紀錄？')) {
      Storage.set('mistakes_speaker', []);
      Storage.set('mistakes_line', []);
      render();
    }
  };
}

function renderLeaderboard() {
  const modes = [
    { key: 'mine_mc', label: '我的角色 / 四選一' },
    { key: 'mine_input', label: '我的角色 / 整句輸入' },
    { key: 'all_mc', label: '全角色 / 四選一' },
    { key: 'all_input', label: '全角色 / 整句輸入' },
  ];
  app.innerHTML = `
    <h2>🏆 排行榜</h2>
    <p class="subtitle">本機紀錄（同一裝置可見）。設定暱稱後練習即可上榜。</p>
    <div class="tabs" id="lbTabs">
      ${modes.map((m, i) => `<button class="tab ${i===0?'active':''}" data-key="${m.key}">${m.label}</button>`).join('')}
    </div>
    <div id="lbList"></div>
    <div class="card" style="margin-top:16px">
      <h3>匯出 / 匯入（分享給同學）</h3>
      <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:12px">把 JSON 複製給同學，或貼上同學的資料合併。</p>
      <button class="btn btn-sm btn-outline" id="btnExport" style="width:auto;margin-right:8px">匯出全部排行</button>
      <button class="btn btn-sm btn-outline" id="btnImport" style="width:auto">匯入合併</button>
    </div>
  `;
  function showLB(key) {
    document.querySelectorAll('#lbTabs .tab').forEach(t => t.classList.toggle('active', t.dataset.key === key));
    const board = Storage.get('lb_' + key, []);
    const list = document.getElementById('lbList');
    if (board.length === 0) {
      list.innerHTML = '<div class="empty-state">尚無紀錄，快去練習吧！</div>';
      return;
    }
    list.innerHTML = board.map((e, i) => `
      <div class="leaderboard-item">
        <div class="rank ${i===0?'gold':i===1?'silver':i===2?'bronze':''}">${i+1}</div>
        <div style="flex:1">
          <strong>${e.name}</strong>
          <div style="font-size:0.8rem;color:var(--text-muted)">角色 ${e.speaker} · 台詞 ${e.line} · 共 ${e.answered} 題</div>
        </div>
        <div style="font-weight:700;color:var(--highlight)">${e.total}</div>
      </div>
    `).join('');
  }
  showLB('mine_mc');
  document.querySelectorAll('#lbTabs .tab').forEach(t => t.onclick = () => showLB(t.dataset.key));
  document.getElementById('btnExport').onclick = () => {
    const data = {};
    modes.forEach(m => data[m.key] = Storage.get('lb_' + m.key, []));
    const str = JSON.stringify(data, null, 2);
    navigator.clipboard.writeText(str).then(() => toast('已複製到剪貼簿')).catch(() => {
      prompt('請手動複製：', str);
    });
  };
  document.getElementById('btnImport').onclick = () => {
    const str = prompt('貼上匯出的 JSON：');
    if (!str) return;
    try {
      const data = JSON.parse(str);
      modes.forEach(m => {
        if (data[m.key]) {
          const existing = Storage.get('lb_' + m.key, []);
          const map = {};
          [...existing, ...data[m.key]].forEach(e => {
            if (!map[e.name] || e.total > map[e.name].total) map[e.name] = e;
          });
          const merged = Object.values(map).sort((a, b) => b.total - a.total).slice(0, 50);
          Storage.set('lb_' + m.key, merged);
        }
      });
      toast('匯入成功');
      render();
    } catch {
      toast('JSON 格式錯誤');
    }
  };
}

function renderScript() {
  const roleChecks = ALL_SPEAKERS.map(r => `
    <label class="checkbox-item" style="padding:6px 10px">
      <input type="checkbox" value="${r}" ${state.highlightRoles.includes(r) ? 'checked' : ''} class="hl-cb">
      ${r}
    </label>
  `).join('');

  let html = `
    <h2>📖 完整劇本</h2>
    <div class="card">
      <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:8px">勾選角色後，該角色台詞會高亮顯示</p>
      <div class="checkbox-group" style="max-height:150px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:4px">${roleChecks}</div>
    </div>
  `;
  let currentAct = '';
  RAW_LINES.forEach(l => {
    if (l.act !== currentAct) {
      currentAct = l.act;
      html += `<div class="act-header">${l.act} · ${l.scene}</div>`;
    } else if (l.scene !== (RAW_LINES[l.order - 1]?.scene)) {
      html += `<div class="act-header" style="opacity:0.8">${l.act} · ${l.scene}</div>`;
    }
    const hl = l.speakers.some(s => state.highlightRoles.includes(s));
    html += `
      <div class="script-line ${hl ? 'highlight' : ''}">
        <span class="spk">${l.speakers.join(' & ')}:</span> ${l.text}
      </div>
    `;
  });
  app.innerHTML = html;
  document.querySelectorAll('.hl-cb').forEach(cb => {
    cb.onchange = () => {
      state.highlightRoles = [...document.querySelectorAll('.hl-cb:checked')].map(c => c.value);
      render();
    };
  });
}

// Init
render();
  </script>
</body>
</html>
